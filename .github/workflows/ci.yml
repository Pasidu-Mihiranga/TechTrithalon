name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Gradle tests + OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Runs unit + Testcontainers tests (Docker is available on the runner) and
      # OpenApiContractTest, which fails if apps/api/openapi.json no longer matches the API.
      - name: Test
        working-directory: apps/api
        run: ./gradlew test --no-daemon

  web:
    name: Web · lint, typecheck, test, build, client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Generated token files must match tokens.json.
      - name: Design tokens are up to date
        run: |
          pnpm --dir packages/design-tokens build
          git diff --exit-code -- packages/design-tokens \
            || (echo "::error::design tokens are stale. Run 'pnpm --dir packages/design-tokens build' and commit." && exit 1)
      - name: Lint
        run: pnpm --dir apps/web lint
      - name: Typecheck
        run: pnpm --dir apps/web typecheck
      - name: Unit tests
        run: pnpm --dir apps/web test
      - name: Build
        run: pnpm --dir apps/web build
      # The generated TypeScript client must match the committed OpenAPI contract.
      - name: Generated client is up to date
        run: |
          pnpm --dir apps/web generate:api
          git diff --exit-code -- apps/web/src/generated \
            || (echo "::error::apps/web/src/generated is stale. Run 'pnpm --dir apps/web generate:api' and commit." && exit 1)

  intelligence:
    name: Intelligence · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/intelligence/pyproject.toml
      - run: pip install -e './apps/intelligence[dev]'
      - run: pytest apps/intelligence/tests

  compose-smoke:
    name: Compose smoke · whole stack
    runs-on: ubuntu-latest
    needs: [api, web, intelligence]
    env:
      # The real dataset is never in the repo; the smoke test runs on small synthetic fixtures.
      REFERENCE_DATA_HOST_DIR: ./apps/api/src/test/resources/reference-fixture
      EXPECTED_OUTLETS: '3'
      EXPECTED_VEHICLES: '2'
      EXPECTED_CALENDAR_DAYS: '5'
      DEMO_DATA_HOST_DIR: ./apps/api/src/test/resources/demo-fixture
      EXPECTED_DEMO_ORDERS: '2'
      EXPECTED_DEMO_FLEET: '1'
      DEMO_CLOCK_INSTANT: '2026-06-25T11:00:00Z'
      EXPECTED_DISTRICTS: '2'
      EXPECTED_SERVICE_ALLOWANCES: '9'
      SEED_STORE_MANAGER_OUTLET: OUT901
      SEED_DRIVER_VEHICLE: VEH901
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack from clean volumes
        run: |
          cp .env.example .env
          python3 - <<'PYCODE'
          import secrets
          from pathlib import Path
          config = Path('.env')
          text = config.read_text().replace('SEED_STORE_MANAGER_OUTLET=OUT001', 'SEED_STORE_MANAGER_OUTLET=OUT901')
          text = text.replace('SEED_DRIVER_VEHICLE=VEH036', 'SEED_DRIVER_VEHICLE=VEH901')
          for role in ['DISPATCHER', 'STORE_MANAGER', 'LOADER', 'DRIVER']:
              text = text.replace(f'SEED_{role}_PASSWORD=', f'SEED_{role}_PASSWORD={secrets.token_urlsafe(24)}')
          config.write_text(text)
          PYCODE
          docker compose up --build -d
      - name: Smoke test
        run: ./scripts/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Authentication browser journeys
        run: pnpm --dir apps/web test:e2e
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
