spring:
  application:
    name: techtrithalon-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techtrithalon}
    username: ${SPRING_DATASOURCE_USERNAME:techtrithalon}
    password: ${SPRING_DATASOURCE_PASSWORD:local-development-only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  intelligence-base-url: ${INTELLIGENCE_BASE_URL:http://localhost:8000}
  web-origins: ${WEB_ORIGINS:http://localhost:5173}
  reference:
    data-dir: ${REFERENCE_DATA_DIR:../../dataset/data/General Data}
    seed-on-startup: ${REFERENCE_SEED_ON_STARTUP:true}
    # Seeded delivery day used by the walkthrough. Validated at startup against calendar_day.is_operating.
    demo-operating-date: ${DEMO_OPERATING_DATE:2026-06-26}
    # Row counts of the supplied dataset. The import rolls back if they do not match.
    expected:
      outlets: ${EXPECTED_OUTLETS:120}
      vehicles: ${EXPECTED_VEHICLES:60}
      calendar-days: ${EXPECTED_CALENDAR_DAYS:910}
      districts: ${EXPECTED_DISTRICTS:12}
      service-allowances: ${EXPECTED_SERVICE_ALLOWANCES:9}
