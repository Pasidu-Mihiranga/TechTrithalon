<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="760" height="596" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="13"><rect x="0" y="0" width="760" height="596" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="24" y="30" font-size="15" font-weight="bold" fill="#111827">Four roles share one system, and every deferral is a recorded decision</text><text x="24" y="50" font-size="11.5" fill="#6b7280">Use cases by actor · accent marks the named degradation path</text><rect x="128" y="70" width="504" height="486" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="142" y="92" font-size="11.5" font-weight="bold" fill="#6b7280">Waypoint Operations</text><path d="M112 182L142 126" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 182L142 182" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 182L142 238" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 406L142 294" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 406L142 350" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 406L142 406" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 406L142 462" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M112 406L142 518" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M618 126L656 182" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M618 182L656 182" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M618 238L656 182" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M618 294L656 350" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M618 350L656 350" fill="none" stroke="#8a8f98" stroke-width="1"/><path d="M618 406L656 350" fill="none" stroke="#8a8f98" stroke-width="1"/><g fill="none" stroke="#8a8f98" stroke-width="1.25"><circle cx="60" cy="152" r="9"/><path d="M60 161V178"/><path d="M48 168H72"/><path d="M60 178L51 191"/><path d="M60 178L69 191"/></g><text x="60" y="208" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Store Manager</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><circle cx="60" cy="376" r="9"/><path d="M60 385V402"/><path d="M48 392H72"/><path d="M60 402L51 415"/><path d="M60 402L69 415"/></g><text x="60" y="432" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Dispatcher</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><circle cx="696" cy="152" r="9"/><path d="M696 161V178"/><path d="M684 168H708"/><path d="M696 178L687 191"/><path d="M696 178L705 191"/></g><text x="696" y="208" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Loader</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><circle cx="696" cy="320" r="9"/><path d="M696 329V346"/><path d="M684 336H708"/><path d="M696 346L687 359"/><path d="M696 346L705 359"/></g><text x="696" y="376" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Driver</text><rect x="142" y="104" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="130" font-size="13" text-anchor="middle" fill="#111827">Place order before cutoff</text><rect x="142" y="160" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="186" font-size="13" text-anchor="middle" fill="#111827">Track status and ETA</text><rect x="142" y="216" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="235" font-size="13" text-anchor="middle" fill="#111827">Confirm receipt</text><text x="256" y="252" font-size="11.5" text-anchor="middle" fill="#6b7280">«extend» Report discrepancy</text><rect x="142" y="272" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="298" font-size="13" text-anchor="middle" fill="#111827">Close order queue at 16:00</text><rect x="142" y="328" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="354" font-size="13" text-anchor="middle" fill="#111827">Allocate orders to vehicles</text><rect x="142" y="384" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="403" font-size="13" text-anchor="middle" fill="#111827">Defer order with reason</text><text x="256" y="420" font-size="11.5" text-anchor="middle" fill="#6b7280">«include» Notify store</text><rect x="142" y="440" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="466" font-size="13" text-anchor="middle" fill="#111827">Monitor live run</text><rect x="142" y="496" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="522" font-size="13" text-anchor="middle" fill="#111827">Plan future capacity</text><rect x="390" y="104" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="504" y="130" font-size="13" text-anchor="middle" fill="#111827">Load trip by stop sequence</text><rect x="390" y="160" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="504" y="179" font-size="13" text-anchor="middle" fill="#111827">Report shortfall</text><text x="504" y="196" font-size="11.5" text-anchor="middle" fill="#6b7280">«extend» Hold vehicle</text><rect x="390" y="216" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="504" y="242" font-size="13" text-anchor="middle" fill="#111827">Hand over trip to driver</text><rect x="390" y="272" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="504" y="298" font-size="13" text-anchor="middle" fill="#111827">Record stop outcome</text><rect x="390" y="328" width="228" height="44" rx="22" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="504" y="354" font-size="13" text-anchor="middle" fill="#111827">Capture proof of delivery</text><rect x="390" y="384" width="228" height="44" rx="22" fill="#1a73e8" fill-opacity="0.12" stroke="#1a73e8" stroke-width="2"/><text x="504" y="410" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Work offline and sync</text><rect x="390" y="468" width="36" height="16" rx="8" fill="#1a73e8" fill-opacity="0.12" stroke="#1a73e8" stroke-width="2"/><text x="434" y="480" font-size="11.5" fill="#6b7280">named degradation path</text><text x="390" y="504" font-size="11.5" fill="#6b7280">«include» always runs · «extend» runs in a</text><text x="390" y="520" font-size="11.5" fill="#6b7280">named exception case</text></svg>