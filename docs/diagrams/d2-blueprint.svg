<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 764" width="760" height="764" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="13"><rect x="0" y="0" width="760" height="764" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="24" y="30" font-size="15" font-weight="bold" fill="#111827">One order crosses four roles, and every handoff carries a record</text><text x="24" y="50" font-size="11.5" fill="#6b7280">Service blueprint · stages 1 to 7 · accent marks the branch that used to go unrecorded</text><line x1="198" y1="112" x2="198" y2="724" stroke="#dcdfe4" stroke-width="1"/><line x1="380" y1="112" x2="380" y2="724" stroke="#dcdfe4" stroke-width="1"/><line x1="562" y1="112" x2="562" y2="724" stroke="#dcdfe4" stroke-width="1"/><line x1="24" y1="112" x2="736" y2="112" stroke="#8a8f98" stroke-width="1.25"/><text x="107" y="84" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Store Manager</text><text x="107" y="102" font-size="11.5" text-anchor="middle" fill="#6b7280">counter · desktop or phone</text><text x="289" y="84" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Dispatcher</text><text x="289" y="102" font-size="11.5" text-anchor="middle" fill="#6b7280">planning office · desktop</text><text x="471" y="84" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Loader</text><text x="471" y="102" font-size="11.5" text-anchor="middle" fill="#6b7280">dock · shared tablet</text><text x="653" y="84" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Driver</text><text x="653" y="102" font-size="11.5" text-anchor="middle" fill="#6b7280">road · personal phone</text><path d="M107 172V196H289V212" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M289 264V304" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M248 356V380H107V396" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M330 356V380H471V396" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M471 448V472H653V488" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M653 540V564H107V580" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M107 632V656H289V672" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M420 396V344H372" fill="none" stroke="#8a8f98" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="198" y="190" font-size="11.5" text-anchor="middle" fill="#6b7280">before the 16:00 cutoff</text><text x="177" y="374" font-size="11.5" text-anchor="middle" fill="#6b7280">no capacity this run</text><text x="350" y="374" font-size="11.5" text-anchor="middle" fill="#6b7280">manifest version 2</text><text x="562" y="466" font-size="11.5" text-anchor="middle" fill="#6b7280">handover, known issues</text><text x="380" y="558" font-size="11.5" text-anchor="middle" fill="#6b7280">proof and actual quantities</text><text x="198" y="650" font-size="11.5" text-anchor="middle" fill="#6b7280">receipt confirmed or issue raised</text><text x="426" y="358" font-size="11.5" fill="#6b7280">shortfall before departure</text><rect x="24" y="120" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="107" y="136" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">1 · Place order</text><text x="107" y="152" font-size="11.5" text-anchor="middle" fill="#6b7280">Separate dry and</text><text x="107" y="168" font-size="11.5" text-anchor="middle" fill="#6b7280">chilled orders</text><rect x="206" y="212" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="289" y="228" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">2 · Close orders</text><text x="289" y="244" font-size="11.5" text-anchor="middle" fill="#6b7280">One confirmed queue;</text><text x="289" y="260" font-size="11.5" text-anchor="middle" fill="#6b7280">late orders next run</text><rect x="206" y="304" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="289" y="320" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">3 · Plan the run</text><text x="289" y="336" font-size="11.5" text-anchor="middle" fill="#6b7280">kg and m³, temperature,</text><text x="289" y="352" font-size="11.5" text-anchor="middle" fill="#6b7280">access, window, fuel</text><rect x="24" y="396" width="166" height="52" rx="8" fill="#1a73e8" fill-opacity="0.12" stroke="#1a73e8" stroke-width="2"/><text x="107" y="412" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Deferred</text><text x="107" y="428" font-size="11.5" text-anchor="middle" fill="#6b7280">Reason and prior skips;</text><text x="107" y="444" font-size="11.5" text-anchor="middle" fill="#6b7280">next run, not an ETA</text><rect x="388" y="396" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="471" y="412" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">4 · Load</text><text x="471" y="428" font-size="11.5" text-anchor="middle" fill="#6b7280">Rear to front; check</text><text x="471" y="444" font-size="11.5" text-anchor="middle" fill="#6b7280">counts, report short</text><rect x="570" y="488" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="653" y="504" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">5 · Deliver</text><text x="653" y="520" font-size="11.5" text-anchor="middle" fill="#6b7280">Outcome and proof;</text><text x="653" y="536" font-size="11.5" text-anchor="middle" fill="#6b7280">offline saves locally</text><rect x="24" y="580" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="107" y="596" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">6 · Confirm receipt</text><text x="107" y="612" font-size="11.5" text-anchor="middle" fill="#6b7280">Ordered vs loaded vs</text><text x="107" y="628" font-size="11.5" text-anchor="middle" fill="#6b7280">delivered, by line</text><rect x="206" y="672" width="166" height="52" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="289" y="688" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">7 · Plan capacity</text><text x="289" y="704" font-size="11.5" text-anchor="middle" fill="#6b7280">Ten weeks, chilled vs</text><text x="289" y="720" font-size="11.5" text-anchor="middle" fill="#6b7280">reefer fleet, decide</text></svg>