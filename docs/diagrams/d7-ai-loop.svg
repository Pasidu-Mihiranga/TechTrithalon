<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="12.5"><rect x="0" y="0" width="760" height="406" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="24" y="30" font-size="15" font-weight="bold" fill="#111827">The system proposes and validates; the person decides and is recorded</text><text x="24" y="50" font-size="11.5" fill="#6b7280">AI interaction loop · the tinted lane is assisted, the plain lane is human judgement</text><rect x="136" y="126" width="600" height="88" rx="8" fill="#f4f5f7" stroke="#8a8f98" stroke-width="1.25"/><rect x="136" y="246" width="600" height="88" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="24" y="166" font-size="12.5" font-weight="bold" fill="#111827">System</text><text x="24" y="182" font-size="11" fill="#6b7280">proposes</text><text x="24" y="286" font-size="12.5" font-weight="bold" fill="#111827">Person</text><text x="24" y="302" font-size="11" fill="#6b7280">decides</text><path d="M274 170H290" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M359 206V254" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M428 290H444" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M513 254V206" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M582 170H590V290H598" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M667 254V206" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M667 134V110H205V134" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#arrow)"/><text x="436" y="104" font-size="11.5" text-anchor="middle" fill="#6b7280">every run feeds the next forecast</text><rect x="136" y="134" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="205" y="156" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">1 · Read</text><text x="205" y="172" font-size="11" text-anchor="middle" fill="#6b7280">queue, fleet, outlets,</text><text x="205" y="188" font-size="11" text-anchor="middle" fill="#6b7280">calendar</text><rect x="290" y="134" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="359" y="156" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">2 · Propose</text><text x="359" y="172" font-size="11" text-anchor="middle" fill="#6b7280">plan, gates, ranked</text><text x="359" y="188" font-size="11" text-anchor="middle" fill="#6b7280">fixes, late risk</text><rect x="290" y="254" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="359" y="276" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">3 · Review</text><text x="359" y="292" font-size="11" text-anchor="middle" fill="#6b7280">load, route, window</text><text x="359" y="308" font-size="11" text-anchor="middle" fill="#6b7280">risk per vehicle</text><rect x="444" y="254" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="513" y="276" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">4 · Decide</text><text x="513" y="292" font-size="11" text-anchor="middle" fill="#6b7280">accept, rebalance or</text><text x="513" y="308" font-size="11" text-anchor="middle" fill="#6b7280">defer with a reason</text><rect x="444" y="134" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="513" y="156" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">5 · Revalidate</text><text x="513" y="172" font-size="11" text-anchor="middle" fill="#6b7280">publish manifest and</text><text x="513" y="188" font-size="11" text-anchor="middle" fill="#6b7280">notify each role</text><rect x="598" y="254" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="667" y="276" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">6 · Record</text><text x="667" y="292" font-size="11" text-anchor="middle" fill="#6b7280">shortfall, proof and</text><text x="667" y="308" font-size="11" text-anchor="middle" fill="#6b7280">receipt from the field</text><rect x="598" y="134" width="138" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="667" y="156" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111827">7 · Forecast</text><text x="667" y="172" font-size="11" text-anchor="middle" fill="#6b7280">ten weeks, chilled vs</text><text x="667" y="188" font-size="11" text-anchor="middle" fill="#6b7280">reefer capacity</text><rect x="24" y="348" width="8" height="8" rx="2" fill="#1a73e8" stroke="#1a73e8" stroke-width="1.25"/><text x="42" y="356" font-size="11.5" fill="#6b7280">Never automated:- which store waits, the words of the reason, and the store’s receipt confirmation</text></svg>