<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 716" width="760" height="716" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="13"><rect x="0" y="0" width="760" height="716" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#767c86"/></marker></defs><text x="24" y="30" font-size="15" font-weight="bold" fill="#111827">Three gates decide the vehicle; only a human writes the deferral reason</text><text x="24" y="50" font-size="11.5" fill="#4b5563">Allocation and deferral · every gate re-runs after a dispatcher change</text><path d="M250 122V150" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M250 202V230" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M250 302V330" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M250 402V430" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M250 502V530" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M250 582V620" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M460 266V540H490" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M600 514V176H360" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M600 566V614" fill="none" stroke="#767c86" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M380 266H460" fill="none" stroke="#767c86" stroke-width="1.25"/><path d="M380 366H460" fill="none" stroke="#767c86" stroke-width="1.25"/><path d="M380 466H460" fill="none" stroke="#767c86" stroke-width="1.25"/><rect x="140" y="70" width="220" height="52" rx="8" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="250" y="92" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Confirmed order</text><text x="250" y="108" font-size="11.5" text-anchor="middle" fill="#4b5563">from the 16:00 queue</text><rect x="140" y="150" width="220" height="52" rx="8" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="250" y="172" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Candidate vehicle</text><text x="250" y="188" font-size="11.5" text-anchor="middle" fill="#4b5563">at its home depot</text><polygon points="120,266 250,230 380,266 250,302" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="250" y="264" font-size="11.5" text-anchor="middle" fill="#111827">Weight and volume</text><text x="250" y="280" font-size="11.5" text-anchor="middle" fill="#111827">both within limits?</text><polygon points="120,366 250,330 380,366 250,402" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="250" y="364" font-size="11.5" text-anchor="middle" fill="#111827">Refrigerated need and</text><text x="250" y="380" font-size="11.5" text-anchor="middle" fill="#111827">van-only access met?</text><polygon points="120,466 250,430 380,466 250,502" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="250" y="464" font-size="11.5" text-anchor="middle" fill="#111827">Window, 2 trips a day,</text><text x="250" y="480" font-size="11.5" text-anchor="middle" fill="#111827">fuel quota all pass?</text><rect x="140" y="530" width="220" height="52" rx="8" fill="#1a73e8" fill-opacity="0.12" stroke="#1a73e8" stroke-width="2"/><text x="250" y="552" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Propose assignment</text><text x="250" y="568" font-size="11.5" text-anchor="middle" fill="#4b5563">vehicle, trip, stop order</text><rect x="140" y="620" width="220" height="52" rx="8" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="250" y="642" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Dispatcher confirms</text><text x="250" y="658" font-size="11.5" text-anchor="middle" fill="#4b5563">any change revalidates</text><rect x="490" y="514" width="220" height="52" rx="8" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="600" y="536" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Try another vehicle</text><text x="600" y="552" font-size="11.5" text-anchor="middle" fill="#4b5563">or the second trip</text><rect x="490" y="614" width="220" height="52" rx="8" fill="none" stroke="#767c86" stroke-width="1.25"/><text x="600" y="636" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Record deferral reason</text><text x="600" y="652" font-size="11.5" text-anchor="middle" fill="#4b5563">notify store, flag prior skip</text><text x="400" y="260" font-size="11.5" fill="#4b5563">no</text><text x="400" y="360" font-size="11.5" fill="#4b5563">no</text><text x="400" y="460" font-size="11.5" fill="#4b5563">no</text><text x="258" y="320" font-size="11.5" fill="#4b5563">yes</text><text x="258" y="420" font-size="11.5" fill="#4b5563">yes</text><text x="258" y="520" font-size="11.5" fill="#4b5563">yes</text><text x="608" y="350" font-size="11.5" fill="#4b5563">next candidate</text><text x="608" y="594" font-size="11.5" fill="#4b5563">no feasible vehicle left</text></svg>