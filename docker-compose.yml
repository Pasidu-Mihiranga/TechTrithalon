name: techtrithalon

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techtrithalon}
      POSTGRES_USER: ${POSTGRES_USER:-techtrithalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TZ: ${APP_TIME_ZONE:-Asia/Colombo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techtrithalon} -d ${POSTGRES_DB:-techtrithalon}"]
      interval: 5s
      timeout: 5s
      retries: 12

  intelligence:
    build:
      context: .
      dockerfile: infrastructure/docker/intelligence.Dockerfile
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Colombo}
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-techtrithalon}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-techtrithalon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      INTELLIGENCE_BASE_URL: http://intelligence:8000
      REFERENCE_DATA_DIR: /app/reference-data
      TZ: ${APP_TIME_ZONE:-Asia/Colombo}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - "./dataset/data/General Data:/app/reference-data:ro"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
