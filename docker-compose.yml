name: techtrithalon

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techtrithalon}
      POSTGRES_USER: ${POSTGRES_USER:-techtrithalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TZ: ${APP_TIME_ZONE:-Asia/Colombo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techtrithalon} -d ${POSTGRES_DB:-techtrithalon}"]
      interval: 5s
      timeout: 5s
      retries: 12

  intelligence:
    build:
      context: .
      dockerfile: infrastructure/docker/intelligence.Dockerfile
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Colombo}
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-techtrithalon}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-techtrithalon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      INTELLIGENCE_BASE_URL: http://intelligence:8000
      WEB_ORIGINS: http://localhost:${WEB_PORT:-5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL: ${SESSION_TTL:-PT16H}
      SEED_ACCOUNTS_ENABLED: ${SEED_ACCOUNTS_ENABLED:-true}
      SEED_DISPATCHER_USERNAME: ${SEED_DISPATCHER_USERNAME:-DSP-001}
      SEED_DISPATCHER_PASSWORD: ${SEED_DISPATCHER_PASSWORD:-}
      SEED_STORE_MANAGER_USERNAME: ${SEED_STORE_MANAGER_USERNAME:-STM-001}
      SEED_STORE_MANAGER_PASSWORD: ${SEED_STORE_MANAGER_PASSWORD:-}
      SEED_STORE_MANAGER_OUTLET: ${SEED_STORE_MANAGER_OUTLET:-OUT001}
      SEED_LOADER_USERNAME: ${SEED_LOADER_USERNAME:-LDR-001}
      SEED_LOADER_PASSWORD: ${SEED_LOADER_PASSWORD:-}
      SEED_LOADER_DEPOT: ${SEED_LOADER_DEPOT:-Peliyagoda}
      SEED_DRIVER_USERNAME: ${SEED_DRIVER_USERNAME:-DRV-001}
      SEED_DRIVER_PASSWORD: ${SEED_DRIVER_PASSWORD:-}
      DEMO_CLOCK_INSTANT: ${DEMO_CLOCK_INSTANT:-}
      DEMO_OPERATING_DATE: ${DEMO_OPERATING_DATE:-2026-06-26}
      EXPECTED_OUTLETS: ${EXPECTED_OUTLETS:-120}
      EXPECTED_VEHICLES: ${EXPECTED_VEHICLES:-60}
      EXPECTED_CALENDAR_DAYS: ${EXPECTED_CALENDAR_DAYS:-910}
      EXPECTED_DISTRICTS: ${EXPECTED_DISTRICTS:-12}
      EXPECTED_SERVICE_ALLOWANCES: ${EXPECTED_SERVICE_ALLOWANCES:-9}
      REFERENCE_DATA_DIR: /app/reference-data
      DEMO_DATA_DIR: /app/demo-data
      DEMO_SEED_ON_STARTUP: ${DEMO_SEED_ON_STARTUP:-true}
      EXPECTED_DEMO_ORDERS: ${EXPECTED_DEMO_ORDERS:-85}
      EXPECTED_DEMO_FLEET: ${EXPECTED_DEMO_FLEET:-38}
      TZ: ${APP_TIME_ZONE:-Asia/Colombo}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - "${REFERENCE_DATA_HOST_DIR:-./dataset/data/General Data}:/app/reference-data:ro"
      - "${DEMO_DATA_HOST_DIR:-./dataset/data/Test Data}:/app/demo-data:ro"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
